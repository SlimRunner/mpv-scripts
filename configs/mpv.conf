sub-auto=fuzzy

# toggle audio compression profiles (one or the other)
# af=lavfi=[loudnorm=I=-16:LRA=11:TP=-1.5]
# af=lavfi=[dynaudnorm=f=1000:g=15:p=0.9:m=10]

# config below assumes uosc is being used

# uosc provides seeking & volume indicators (via flash-timeline and
# flash-volume commands) if you decide to use them, you don't need
# osd-bar
osd-bar=no

# uosc will draw its own window controls and border if you disable
# window border
border=no
